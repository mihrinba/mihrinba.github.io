:root{
  --bg:#f2f0eb; --card:#ffffff; --ink:#15171d; --muted:#737885; --line:#ebe7df; --soft:#f7f5f1;
  --brand:#0f1b33; --brand-ink:#f3f1ec; --acc:#ff6a2b;
  --g:#178a4a; --gbg:#ddf2e5; --gs:#2fa865; --m:#c8341f; --mbg:#fbe3de; --ms:#e0533c; --b:#8a8f99; --bbg:#e9e6df;
  --hi:#e9f0fc; --you:#3a6fd8; --live:#22a95b; --shadow:0 1px 2px rgba(20,22,28,.04),0 6px 20px rgba(20,22,28,.05);
}
:root[data-theme="dark"]{
  --bg:#0b0f17; --card:#131924; --ink:#eef0f4; --muted:#8f98a7; --line:#212938; --soft:#0f141e;
  --brand:#0d1830; --brand-ink:#eef0f4; --acc:#ff7a3d;
  --g:#62d394; --gbg:#11301f; --gs:#35b56f; --m:#ff8b7b; --mbg:#3a1611; --ms:#df5843; --b:#8f98a7; --bbg:#222a38;
  --hi:#16213a; --you:#6f9cff; --live:#3ddc84; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.num{font-family:Oswald,Inter,sans-serif;font-variant-numeric:tabular-nums}

header{background:var(--brand);color:var(--brand-ink);position:sticky;top:0;z-index:5}
.hin{max-width:600px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left))}
.r1{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:50%;background:var(--acc);display:grid;place-items:center;flex:0 0 auto}
.logo svg{width:21px;height:21px}
.ttl{flex:1;min-width:0}
.ttl .t1{font-family:Oswald,sans-serif;font-size:20px;font-weight:600;line-height:1.1;display:flex;align-items:center;gap:8px}
.ttl .t2{font-size:11px;font-weight:600;opacity:.65;letter-spacing:.04em}
.ident{display:flex;align-items:center;gap:10px;min-width:0}
.av{flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;
  font-family:Oswald,sans-serif;font-weight:700;font-size:16px;letter-spacing:.02em}
.mename{min-width:0;position:relative}
.pn{position:relative;display:flex;width:fit-content;align-items:center;gap:4px;cursor:pointer;max-width:100%}
.pn .pt{font-family:Oswald,sans-serif;font-size:24px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn svg{flex:0 0 auto;width:18px;height:18px;color:var(--muted)}
.pn select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.gpb{display:flex;align-items:baseline;gap:4px;margin-top:5px;font-size:11px;font-weight:600;color:var(--muted);
  letter-spacing:.03em;text-transform:uppercase}
.gpb b{font-family:Oswald,sans-serif;font-size:15px;font-weight:600;color:var(--acc);letter-spacing:0}
.who{display:none}
.who .lg{white-space:nowrap;font-size:10.5px;font-weight:700;letter-spacing:.08em;opacity:.7;display:flex;align-items:center;gap:6px}
.badge{font-size:9.5px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:var(--acc);color:#fff}
.who select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--brand-ink);font-family:Oswald,sans-serif;
  font-size:22px;font-weight:600;padding:0 22px 0 0;margin:0;width:100%;cursor:pointer;line-height:1.2}
.who select option{color:#15171d}
.who::after{content:"";position:absolute;right:4px;bottom:11px;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg);opacity:.7;pointer-events:none}
.ib{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
  color:var(--brand-ink);cursor:pointer;display:grid;place-items:center}
.ib svg{width:17px;height:17px}

.wrap{max-width:600px;margin:0 auto;padding:12px max(16px, env(safe-area-inset-right)) 28px max(16px, env(safe-area-inset-left))}
.cols{display:block}
.side{display:none}
/* tablet */
.w-only{display:none}
/* tablet ve üstü: kategoriler değerleriyle (Yahoo maç ekranı gibi) */
@media (min-width:700px){
  .hin,.wrap,footer{max-width:760px}
  .m-only{display:none !important} .w-only{display:block !important} .tiles.w-only{display:grid !important}
  .big{font-size:46px}
  .pn .pt{font-size:30px}
  .tiles{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:14px}
  .tile{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 6px 7px;text-align:center}
  .tile .k{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.04em}
  .tile .v{font-family:Oswald,sans-serif;font-size:19px;font-weight:600;margin:2px 0 5px;font-variant-numeric:tabular-nums}
  .tile .pb{height:4px;border-radius:2px;background:var(--bbg);overflow:hidden}
  .tile .pb i{display:block;height:100%;border-radius:2px}
  .tile .s{font-size:10px;color:var(--muted);font-weight:600;margin-top:4px}
  .mx{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
  .mx th{font-size:10px;padding:10px 4px 8px;text-align:center;border-bottom:1px solid var(--line);position:static}
  .mx th:first-child{text-align:left;padding-left:16px}
  .mx td{padding:4px 3px;text-align:center;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
  .mx td:first-child{text-align:left;padding-left:16px;width:auto;color:var(--ink);font-weight:700;font-size:14px}
  .mx td.gp{color:var(--muted);font-size:12px;width:40px}
  .mx td.v span{display:block;padding:6px 2px;border-radius:6px;font-weight:600}
  .mx td.v .G{background:var(--gbg);color:var(--g)} .mx td.v .M{background:var(--mbg);color:var(--m)} .mx td.v .B{background:var(--bbg);color:var(--b)}
  .mx td.scr{font-family:Oswald,sans-serif;font-size:16px;font-weight:600;padding-right:16px;width:60px;text-align:right}
  .mx td.scr.G{color:var(--g)} .mx td.scr.M{color:var(--m)} .mx td.scr.B{color:var(--b)}
  .mx tr.mine td{background:var(--soft)} .mx tr.mine td.v span{font-weight:800;color:var(--ink)}
  .mx tr.mine td:first-child small{display:block;font-size:9px;letter-spacing:.08em;color:var(--muted);font-weight:800}
  .mx tr.real td{background:var(--hi)} .mx tr.real td:first-child{box-shadow:inset 4px 0 0 var(--acc)}
  .mx tr.real td:first-child small{display:block;font-size:9px;letter-spacing:.08em;color:var(--acc);font-weight:800}
  .mx tr:last-child td{border-bottom:0}
}
/* masaüstü: üstte hafta şeridi, altta solda hafta, sağda puan tablosu — aynı hizada */
@media (min-width:1080px){
  .hin,.wrap,footer{max-width:1240px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
  .side{display:block;position:sticky;top:76px}
  .side .card{margin:0}
  .side .sh{display:flex;align-items:center;gap:8px;padding:12px 16px 10px;border-bottom:1px solid var(--line);
    font-family:Oswald,sans-serif;font-weight:600;font-size:15px;letter-spacing:.03em}
  .side .sh svg{width:17px;height:17px;color:var(--acc)}
  .side table th{position:static}
  #cup{display:none}
  .wkrow .strip{-webkit-mask-image:none;mask-image:none}
}
@media (hover:hover){
  .wk:hover{border-color:var(--muted)} .opp:hover{background:var(--soft)} th.so:hover{color:var(--ink)}
}

/* hafta şeridi */
.strip{display:flex;gap:6px;position:relative;overflow-x:auto;margin:0 0 10px;scrollbar-width:none;padding:1px}
.strip::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:8px;height:50px;min-width:42px;padding:0 9px;border-radius:10px;
  background:var(--card);border:1px solid var(--line);cursor:pointer;overflow:hidden;transition:background .15s}
.wk .no{display:flex;flex-direction:column;align-items:center;line-height:1}
.wk .no small{font-size:8px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.wk .no b{font-family:Oswald,sans-serif;font-size:21px;font-weight:600;margin-top:1px}
.wk.live:not([aria-pressed="true"]) .no{margin-top:-4px}
.wk .dt{display:none;flex-direction:column;line-height:1.15;font-size:11.5px;font-weight:600;white-space:nowrap}
.wk .dt span{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--acc);text-transform:uppercase}
.wk.live::before{content:"";position:absolute;bottom:3px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--live);
  box-shadow:0 0 0 0 var(--live);animation:pulse 1.8s infinite}
.wk.live[aria-pressed="true"]::before{display:none}
.wk.live .dt span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px;animation:pulse 1.8s infinite}
.wk.live .dt span{color:var(--live)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@media (prefers-reduced-motion:reduce){.wk.live::before{animation:none}}
.wk[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:inset 0 -3px 0 var(--acc)}
.wk[aria-pressed="true"] .no small{color:var(--brand-ink);opacity:.6}
.wk[aria-pressed="true"] .dt{display:flex}
.wkrow{display:flex;gap:6px;align-items:stretch;margin:0 0 10px}
.wkrow .strip{flex:1;min-width:0;margin:0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
.wk.tbl{flex:0 0 auto;flex-direction:column;justify-content:center;gap:3px;margin:1px 0}
.wk.tbl svg{width:19px;height:19px}
.wk.tbl .lbl{font-size:8px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.wk.tbl[aria-pressed="true"] .lbl{color:var(--brand-ink);opacity:.7}
.sep{flex:0 0 1px;background:var(--line);margin:8px 2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.hero{padding:14px 14px 12px;margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px}
.big{font-family:Oswald,sans-serif;font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:flex-end}
.big .x{width:12px;height:3px;border-radius:2px;background:var(--muted);margin:0 7px;opacity:.6;font-size:0}
.big .a{color:var(--g)} .big .b{color:var(--m)}
.cap{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:5px;white-space:nowrap}
.r{text-align:right}
.bars{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:12px}
.bar .t{height:30px;border-radius:5px;background:var(--bbg);position:relative;overflow:hidden}
.bar .f{position:absolute;left:0;right:0;bottom:0;opacity:.6}
.bar .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Oswald,sans-serif;font-size:14px;font-weight:600}
.bar .n small{font-size:9px;font-weight:500;opacity:.6;margin-left:1px}
.bar .k{font-size:9px;font-weight:800;color:var(--muted);margin-top:3px;text-align:center}

.list{overflow:hidden}
.opp{display:grid;grid-template-columns:minmax(0,1fr) repeat(9,21px) 44px;column-gap:2px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.opp:last-child{border-bottom:0}
.opp.is-real{background:var(--hi);box-shadow:inset 4px 0 0 var(--acc);padding-top:9px;padding-bottom:9px}
.opp.is-real .nm div{font-size:15px}
.opp.is-real .sc{font-size:20px}
.opp .flag{display:block;white-space:nowrap;font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--acc);margin-bottom:1px}
.opp .nm{min-width:0;padding-right:4px}
.opp .nm div{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp .nm small{font-size:10px;color:var(--muted);font-weight:600}
.opp .nm small i{font-style:normal;color:var(--acc);font-weight:800;letter-spacing:.04em}
.c{height:22px;border-radius:4px;display:grid;place-items:center;font-size:7.5px;font-weight:800;letter-spacing:0;color:#fff}
.c.G{background:var(--gs)} .c.M{background:var(--ms)} .c.B{background:var(--bbg);color:var(--muted)}
.sc{font-family:Oswald,sans-serif;font-weight:600;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.sc.G{color:var(--g)} .sc.M{color:var(--m)} .sc.B{color:var(--b)}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
th.so{cursor:pointer;user-select:none} th.so.on{color:var(--ink)} th.so i{font-style:normal;font-size:8px;margin-left:3px;color:var(--acc)}
th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child,th:first-child{width:24px;text-align:center;color:var(--muted);padding-left:10px}
td:last-child,th:last-child{padding-right:14px}
tr:last-child td{border-bottom:0}
tr.me td{background:var(--hi)} tr.me td:nth-child(2){font-weight:800}
td.t{font-weight:600} td.mu{color:var(--muted)}

const HELP = {

  <p>Tap a matchup for the category totals. Tap a team name for its players: <b>Matchup Totals</b> (week) or <b>Today's Stats</b>.</p>

    <label class="set"><span>Colors in League Stats<small>shade each column from best (green) to worst (red)</small></span><input type="checkbox" id="setHeat" ${heatOn ? 'checked' : ''}><i></i></label>

    <details class="dbgd"><summary>Data status</summary>${debugInfo()}</details>`;

function debugInfo(){
  const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  const G = (LV.today && LV.today.games) || [];
  const cnt = s => G.filter(g => g.state === s).length;
  return `<table class="dbg">${
    row('Site built', when(D.generated)) +
    row('League source', `${SRC[D.source] || D.source}${cur && cur.snapshot ? ' · ' + when(cur.snapshot) : ''}`) +
    row('Weeks', W.map(w => `W${w.week}${w.final ? ' final' : ' live'}`).join(', ')) +
    (CUR ? row('Box scores in site', CL && CL.through ? `through ${fd(CL.through)} (ESPN, pipeline)` : 'none') : '') +
    (LIVEOK ? row('Last update', LV.at ? hm(LV.at) : '–') : '') + (LIVEOK ? row('Live (ESPN, browser)', LV.err ? `error: ${esc(LV.err)}` : LV.at ? `updated ${hm(LV.at)} · today ${G.length} games: ${cnt('in')} live, ${cnt('pre')} not started, ${cnt('post')} final` : 'loading…') : row('Live', 'off (no current week with lineups)')) +

const fd = s => new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const dd = s => new Date(s+'T12:00:00').getDate();
const res = s => s[0] > s[1] ? 'G' : s[0] < s[1] ? 'M' : 'B';
const fv = (c, v) => (c === 'fg' || c === 'ft') ? (v ? v.toFixed(3).replace(/^0/, '') : '–') : Number(v).toLocaleString('en-US');
const n1 = v => v.toLocaleString('en-US',{minimumFractionDigits:1, maximumFractionDigits:1});
const hm = d => d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const nm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const pshort = n => { const p = n.split(' '); return p.length > 1 ? p[0][0] + '. ' + p.slice(1).join(' ') : n; };
const KEYS = ['min','pts','reb','ast','stl','blk','tpm','fgm','fga','ftm','fta','tov'];
const zero = () => Object.fromEntries(KEYS.map(k => [k, 0]));

// ---- Haram kontrol hesabı (site/haram.py'nin aynısı; süren hafta tarayıcıda canlı hesaplanır) ----
const val = (t, c) => c === 'fg' ? (t.fga ? Math.round(t.fgm / t.fga * 1000) / 1000 : 0) : c === 'ft' ? (t.fta ? Math.round(t.ftm / t.fta * 1000) / 1000 : 0) : (t[c] || 0);
function cmp(a, b){ let w = 0, l = 0, d = 0, o = '';
  D.cats.forEach(c => { const x = val(a, c.key), y = val(b, c.key);
    if (x === y) { d++; o += 'B'; } else if ((x > y) === (c.dir > 0)) { w++; o += 'G'; } else { l++; o += 'M'; } });
  return [w, l, d, o]; }
function weekTable(T, pairs){
  const names = Object.keys(T).sort(), opp = {}, k = names.length - 1;
  pairs.forEach(([a,b]) => { opp[a] = b; opp[b] = a; });
  return names.map(n => {
    const ap = {w:0,l:0,t:0,cw:0,cl:0,ct:0}, vs = {}, cw = Object.fromEntries(D.cats.map(c => [c.key, 0]));
    names.forEach(m => { if (m === n) return; const r = cmp(T[n], T[m]); vs[m] = r;
      ap.cw += r[0]; ap.cl += r[1]; ap.ct += r[2]; ap[r[0] > r[1] ? 'w' : r[0] < r[1] ? 'l' : 't']++;
      D.cats.forEach((c,i) => { if (r[3][i] === 'G') cw[c.key]++; }); });
    ap.avg = [Math.round(ap.cw / k * 10) / 10, Math.round(ap.cl / k * 10) / 10]; ap.catwins = cw;
    let actual = null;
    if (opp[n]) { const r = cmp(T[n], T[opp[n]]); actual = {opp: opp[n], res: r[0] > r[1] ? 'G' : r[0] < r[1] ? 'M' : 'B', score: `${r[0]}-${r[1]}-${r[2]}`}; }
    return {team: n, gp: T[n].gp || 0, vs, ap, actual, raw: T[n], vals: Object.fromEntries(D.cats.map(c => [c.key, val(T[n], c.key)]))};
  });
}

  const th = (k,l,cl='') => `<th class="so${sK===k?' on':''} ${cl}" data-k="${k}"><span>${l}<i>${sK===k ? (sD<0?'▼':'▲') : ''}</i></span></th>`;
  const kf = (k, x) => pts ? (Number.isInteger(x) ? String(x) : n1(x)) : season && k !== 'fg' && k !== 'ft' && x >= 1000 ? (x / 1000).toFixed(1).replace(/\.0$/, '') + 'K' : fv2(k, x);   // totals: 4702 → 4.7K so the table always fits
  const body = sorted.map(r => `<tr class="${r.team===me?'me':''}"><td class="rk mu">${r.rk}</td><td class="t">${SN(r.team)}</td>${pts ? '' : `<td class="mu">${kf('gp', r.gp)}</td>`}${D.cats.map(c => `<td style="${heatOn ? shade[r.team + c.key] : ''}">${kf(c.key, r.vals[c.key])}</td>`).join('')}</tr>`).join('');
  const sw = [['tot','Totals'],['pts','Points']].map(([k,l]) => `<button data-sa="${k}" aria-pressed="${(k==='pts')===sPts}">${l}</button>`).join('');
  return `<div class="card lg"><table class="lgt heat${season && !pts ? ' tot' : ''}"><thead><tr>${th('rk','#','rk')}${season ? `<th class="t sv"><span class="mini">${sw}</span></th>` : th('team','Team','t')}${pts ? '' : th('gp','GP')}${D.cats.map(c => th(c.key, c.short)).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
}

// ---- Haram check (selected team vs everyone) ----
let hOpen = '', hK = 'har', hD = -1;
function haramLeague(w, me){
  const rows = rowsOf(w), NN = rows.length - 1;
  const L = rows.map(r => { const [p,,t] = r.actual ? r.actual.score.split('-').map(Number) : [0,0,0];
    const act = p + 0.5 * t, exp = (r.ap.cw + 0.5 * r.ap.ct) / NN; return {team: r.team, score: r.actual ? r.actual.score.split('-').slice(0,2).join('–') : '', act, exp, har: act - exp}; });
  const sorted = [...L].sort((a,b) => hK === 'team' ? hD * a.team.localeCompare(b.team) : hD * (a[hK] - b[hK]) || a.team.localeCompare(b.team));
  const f1 = v => Number.isInteger(v) ? String(v) : n1(v);
  const th = (k,l,cl='') => `<th class="so${hK===k?' on':''} ${cl}" data-h="${k}">${l}<i>${hK===k ? (hD<0?'▼':'▲') : ''}</i></th>`;
  const body = sorted.map((x,i) => `<tr class="hr${x.team===me?' me':''}${hOpen===x.team?' op':''}" data-ho="${esc(x.team)}"><td class="rk">${i+1}</td><td class="t">${SN(x.team)}<i class="car">${hOpen===x.team?'▾':'▸'}</i></td><td class="mu">${x.score}</td>
    <td class="pt2">${f1(x.act)}</td><td>${n1(x.exp)}</td><td class="hv ${x.har>0.2?'up':x.har<-0.2?'dn':''}">${Math.abs(x.har) < 0.05 ? '0.0' : (x.har>0?'+':'') + n1(x.har)}</td></tr>${hOpen===x.team ? `<tr class="hdet"><td colspan="6">${haramMine(w, x.team)}</td></tr>` : ''}`).join('');
  return `<div class="card stand hl"><table><thead><tr><th class="rk">#</th>${th('team','Team')}<th>Score</th>${th('act','Got')}${th('exp','Fair')}${th('har','Haram')}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function haramView(w, me){ return haramMine(w, me); }
function haramMine(w, me){
  if (!me) return '<div class="card empty">Pick your team at the top.</div>';
  const rows = rowsOf(w), r = rows.find(x => x.team === me);
  if (!r) return '<div class="card empty">Team not in this week.</div>';
  const gp = Object.fromEntries(rows.map(x => [x.team, x.gp])), byT = Object.fromEntries(rows.map(x => [x.team, x]));
  const a = r.actual, ap = r.ap;
  const colr = p => p > .55 ? 'color-mix(in srgb,var(--gs) 80%,var(--card))' : p < .45 ? 'color-mix(in srgb,var(--ms) 80%,var(--card))' : 'var(--b)';   // same colors as the grid: beat most = green, lost to most = red
  const avA = (ap.cw + 0.5 * ap.ct) / N, avB = (ap.cl + 0.5 * ap.ct) / N;       // ties count half each: always sums to 9
  const bars = D.cats.map(c => { const n = ap.catwins[c.key], p = n / N;
    return `<div class="bar" title="${esc(c.name)}: ${n}/${N}"><div class="t"><div class="f" style="height:${Math.max(6,p*100)}%;background:${colr(p)}"></div><div class="n">${n}</div></div><div class="k">${c.short}</div></div>`; }).join('');
  const tiles = D.cats.map(c => { const n = ap.catwins[c.key], p = n / N;
    return `<div class="tile"><div class="k">${c.short}</div><div class="v">${fv(c.key, r.vals[c.key])}</div><div class="pb"><i style="width:${Math.max(4,p*100)}%;background:${colr(p)}"></i></div><div class="s">${n}/${N}</div></div>`; }).join('');
  const ro = a ? a.opp : null;
  const opps = teams.filter(t => t !== me).sort((x,y) => (r.vs[y][0]-r.vs[y][1]) - (r.vs[x][0]-r.vs[x][1]) || r.vs[y][0]-r.vs[x][0] || SN(x).localeCompare(SN(y)));
  const head = `<div class="opp oh"><div class="nm"><span></span><small>GP</small></div>${D.cats.map(c => `<span class="k">${({fg:'FG',ft:'FT',tpm:'3P',pts:'PT',reb:'RB',ast:'AS',stl:'ST',blk:'BK',tov:'TO'})[c.key]}</span>`).join('')}<span></span></div>`;
  const list = opps.map(o => { const v = r.vs[o], k = res(v);
    return `<div class="opp${o===ro?' is-real':''}"><div class="nm"><span title="${esc(o)}">${SN(o)}${o===ro?' <span class="flag">OPP</span>':''}</span><small>${gp[o]}</small></div>
      ${D.cats.map((c,i) => `<span class="c ${v[3][i]}" title="${esc(c.name)}"></span>`).join('')}<span class="sc ${k}">${v[0]}–${v[1]}</span></div>`; }).join('');
  const oth = rows.filter(x => x.team !== me), oGp = oth.reduce((n, x) => n + x.gp, 0) / Math.max(1, oth.length);
  const vsc = `<b class="${avA > avB ? 'w' : ''}">${n1(avA)}</b><i>–</i><b class="${avB > avA ? 'w' : ''}">${n1(avB)}</b>`;
  return `<div class="card hero"><div class="mr hvs" title="Average score if you played all ${N} teams">
        <span class="mt"><b>${SN(me)}</b><small>${gpTxt(w, me, r.gp)}</small></span><span class="ms">${vsc}</span>
        <span class="mt r"><b>All ${N}</b><small>avg ${n1(oGp)} GP</small></span><span></span></div>
      <div class="bars m-only">${bars}</div><div class="tiles w-only">${tiles}</div>
      <div class="list m-only joined">${head}${list}</div></div>
    <div class="card w-only" style="overflow:hidden"><table class="mx"><thead><tr><th>Opponent</th><th>GP</th>${D.cats.map(c => `<th>${c.short}</th>`).join('')}<th style="text-align:right;padding-right:16px">Score</th></tr></thead>
      <tbody><tr class="mine"><td>${SN(me)}</td><td class="gp">${r.gp}</td>${D.cats.map(c => `<td class="v"><span>${fv(c.key, r.vals[c.key])}</span></td>`).join('')}<td class="scr"></td></tr>
      ${opps.map(o => { const v = r.vs[o], k = res(v), ov = byT[o].vals;
        return `<tr class="r${k}${o===ro?' real':''}"><td>${o===ro?'<small>OPPONENT</small>':''}${SN(o)}</td><td class="gp">${gp[o]}</td>
          ${D.cats.map((c,i) => `<td class="v"><span class="${v[3][i]}">${fv(c.key, ov[c.key])}</span></td>`).join('')}<td class="scr ${k}">${v[0]}–${v[1]}</td></tr>`; }).join('')}
      </tbody></table></div>`;
}

// ---- Standings through the selected week (the live week counts as if it ended now) ----
let sortK = 'pts', sortD = -1;
function standAt(w, weekOnly){
  const upto = weekOnly ? [w] : W.filter(x => x.week <= w.week);
  const acc = {}; teams.forEach(t => acc[t] = {team: t, pts: 0, pexp: 0, wk: 0});
  const add = (x, last) => { const rows = rowsOf(x), NN = rows.length - 1;
    rows.forEach(r => { const a = acc[r.team]; if (!a) return; const [p,,t] = r.actual ? r.actual.score.split('-').map(Number) : [0,0,0];
      const v = p + 0.5 * t; a.pts += v; a.pexp += (r.ap.cw + 0.5 * r.ap.ct) / NN; if (last) a.wk = v; }); };
  const order = () => Object.values(acc).sort((a,b) => b.pts - a.pts || b.pexp - a.pexp).map(x => x.team);
  upto.slice(0, -1).forEach(x => add(x, false));
  const before = upto.length > 1 ? order() : [...teams].sort((a,b) => a.localeCompare(b));   // week 1: start from alphabetical order
  add(upto.at(-1), true);
  const now = order();
  return now.map((t,i) => ({...acc[t], rank: i + 1, pdiff: acc[t].pts - acc[t].pexp, move: before ? before.indexOf(t) - i : 0}));
}
const PLAYOFF = (D.playoff || 8);          // ilk 8 playoff
function tableView(me){
  const w = W.at(-1), multi = W.length > 1, S = standAt(w, false);
  const f1 = v => Number.isInteger(v) ? String(v) : n1(v);
  const cols = [['pts','Total'], ['base', w.week > 1 ? `W1–${w.week - 1}` : 'Prev'], ['wk', `W${w.week}`], ['pdiff','Haram']];
  if (![...cols.map(c => c[0]), 'team', 'rank'].includes(sortK)) { sortK = 'pts'; sortD = -1; }
  S.forEach(s => s.base = s.pts - s.wk);
  const rows = [...S].sort((a,b) => sortK === 'team' ? sortD * a.team.localeCompare(b.team) : sortD * (a[sortK] - b[sortK]) || a.rank - b.rank)
    .map(s => { const d = s.pdiff;
      const mv = s.move > 0 ? `<i class="mv up">▲${s.move}</i>` : s.move < 0 ? `<i class="mv dn">▼${-s.move}</i>` : '';
      return `<tr class="${s.team===me?'me':''}${PLAYOFF && sortK === 'pts' && sortD < 0 && s.rank === PLAYOFF ? ' pocut' : ''}"><td class="rk">${s.rank}${mv}</td><td class="t" title="${esc(s.team)}">${SN(s.team)}</td>
        <td class="pt2">${f1(s.pts)}</td><td class="bsc">${f1(s.base)}</td><td class="wkc">${f1(s.wk)}</td><td class="${d>0.2?'up':d<-0.2?'dn':''}">${Math.abs(d) < 0.05 ? '0.0' : (d>0?'+':'') + n1(d)}</td></tr>`; }).join('');
  const th = (k,l) => `<th class="so${sortK===k?' on':''}" data-t="${k}">${l}<i>${sortK===k ? (sortD<0?'▼':'▲') : ''}</i></th>`;
  return `<div class="card stand"><table><thead><tr><th class="rk">#</th>${th('team','Team')}${cols.map(([k,l]) => th(k,l)).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

const isLive = w => w === CUR && LIVEOK && !LV.err && LV.today && LV.today.games.some(g => g.state === 'in');
const TABS = {week: [['mu','Matchups'],['stat','Week Stats'],['haram','Haram']], season: [['table','Standings'],['sstat','Team Stats']]};
const ARR = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="${d}"/></svg>`;
const curW = () => W.find(x => x.week === sel_) || cur;
// in the Season title: your team's live rank and its move this week
function myRank(){
  const me = sel.value; if (!me) return '';
  const r = standAt(W.at(-1), false).find(x => x.team === me); if (!r) return '';
  const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th','st','nd','rd'][n % 10] || 'th');
  const mv = r.move > 0 ? `<i class="up">▲${r.move}</i>` : r.move < 0 ? `<i class="dn">▼${-r.move}</i>` : '';
  return `<span class="srk">${esc(D.short[me] || me)} ${ord(r.rank)}${mv}</span>`;
}
function strip(){
  const w = curW(), i = W.indexOf(w), wk = mode === 'week';
  const badge = isLive(w) ? `<span class="nb live" title="Live"><span class="ld"></span></span>` : w.final ? '<span class="nb">Final</span>' : '';
  const opts = W.map(x => `<option value="${x.week}"${x === w ? ' selected' : ''}>Week ${x.week} · ${rng(x)}</option>`).join('');
  // same layout in both modes (arrows only hidden), so the bar never changes height
  const weekCell = `<div class="mc${wk ? ' on' : ''}"${wk ? '' : ' data-mode="week" role="button"'}>
        <button class="st${wk ? '' : ' hid'}" data-step="-1" ${i <= 0 ? 'disabled' : ''} aria-label="Previous week">${ARR('M15 6l-6 6 6 6')}</button>
        <label class="wsel"><b>Week ${w.week}</b><span>${rng(w)}</span>${badge}${wk ? `<select aria-label="Week">${opts}</select>` : ''}</label>
        <button class="st${wk ? '' : ' hid'}" data-step="1" ${i >= W.length - 1 ? 'disabled' : ''} aria-label="Next week">${ARR('M9 6l6 6-6 6')}</button></div>`;
  const seasonCell = `<button class="mc ms2${wk ? '' : ' on'}" data-mode="season"><b>Season</b></button>`;
  const tabs = TABS[mode];
  const cur_ = wk ? tab : stab;
  const seasonTitle = `<div class="mc on sttl"><span class="wsel"><b>${W.length > 1 ? `Weeks 1–${W.length}` : 'Week 1'}</b></span></div>`;
  $('#nav').innerHTML = `<div class="nv1 modes c3">${wk ? weekCell : seasonTitle}</div>
    <div class="nv2">${tabs.map(([k,l]) => `<button data-tab="${k}" aria-pressed="${cur_===k}">${l}</button>`).join('')}</div>`;
  document.querySelectorAll('#hmode [data-hm]').forEach(b => { b.setAttribute('aria-pressed', b.dataset.hm === mode);
    b.onclick = () => { mode = b.dataset.hm; st.set('mode', mode); render(); }; });
  const go = v => { sel_ = v; openMu = null; render(); };
  const sl = $('#nav select'); if (sl) sl.onchange = e => go(+e.target.value);
  document.querySelectorAll('#nav [data-step]').forEach(b => b.onclick = () => go(W[i + +b.dataset.step].week));
  document.querySelectorAll('#nav [data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; st.set('mode', mode); render(); });
  document.querySelectorAll('#nav [data-tab]').forEach(b => b.onclick = () => { if (wk) { tab = b.dataset.tab; st.set('tab', tab); } else { stab = b.dataset.tab; st.set('stab', stab); } render(); });
}

const WIDE = matchMedia('(min-width:1080px)');
function paint(){
  const me = sel.value, out = $('#out');
  if (!cur) { out.innerHTML = '<div class="card empty">No data yet.</div>'; return; }
  const w = curW();
  const main = mode === 'season' ? (stab === 'table' ? tableView(me) : statView(W.at(-1), me, true))
    : tab === 'mu' ? muView(w, me) : tab === 'stat' ? statView(w, me, false) : haramView(w, me);
  const y = window.scrollY;
  out.innerHTML = WIDE.matches && mode === 'week'
    ? `<div class="cols"><div>${main}</div><aside class="side">${tableView(me).replace('<div class="card stand">', `<div class="card stand"><div class="sh">${CUP}Standings</div>`)}</aside></div>`
    : main;
  window.scrollTo(0, y);
  bind();
}
function bind(){
  const toOpen = () => { const el = document.querySelector('.mi.open'); if (el) el.scrollIntoView({block: 'start', behavior: 'smooth'}); };
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const a = b.dataset.m, closing = openMu === a;
    if (closing) { openMu = ''; paint(); const row = document.querySelector(`.mi [data-m="${CSS.escape(a)}"]`);   // plain close
      if (row && row.getBoundingClientRect().top < 0) row.closest('.mi').scrollIntoView({block: 'start'}); return; }
    openMu = a; dView = 'cat'; paint(); toOpen(); });
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { dView = b.dataset.v; paint(); toOpen(); });
  document.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => setTimeout(toOpen, 0)));
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { pScope = b.dataset.p; paint(); });
  document.querySelectorAll('[data-ms]').forEach(b => b.onclick = e => { e.stopPropagation(); mHaram = b.dataset.ms === 'haram'; st.set('msub', mHaram ? 'haram' : 'gp'); paint(); });
  document.querySelectorAll('[data-sa]').forEach(b => b.onclick = e => { e.stopPropagation(); sPts = b.dataset.sa === 'pts'; st.set('savg', sPts ? 'pts' : 'tot');  paint(); });
  document.querySelectorAll('tr[data-ho]').forEach(r => r.onclick = () => { const t = r.dataset.ho; hOpen = hOpen === t ? '' : t; paint(); });
  document.querySelectorAll('th.so[data-h]').forEach(h => h.onclick = () => { const k = h.dataset.h;
    if (hK === k) hD = -hD; else { hK = k; hD = k === 'team' ? 1 : -1; } paint(); });
  document.querySelectorAll('th.so[data-k]').forEach(h => h.onclick = () => { const k = h.dataset.k;
    if (sK === k) sD = -sD; else { sK = k; const c = D.cats.find(c => c.key === k); sD = k === 'team' ? 1 : c && c.dir < 0 ? 1 : -1; } paint(); });
  document.querySelectorAll('th.so[data-t]').forEach(h => h.onclick = () => { const k = h.dataset.t;
    if (sortK === k) sortD = -sortD; else { sortK = k; sortD = k === 'team' ? 1 : -1; } paint(); });
}
function render(){ strip(); paint(); }
WIDE.addEventListener ? WIDE.addEventListener('change', render) : WIDE.addListener(render);
render();
refreshLive();
})();
</script>
</body>
